name: openclaw-rescue-desktop

services:
  desktop:
    build:
      context: .
      args:
        NODE_VERSION: "24.16.0"
        OPENCLAW_VERSION: "2026.9.6"
    image: openclaw-rescue-desktop:2026.9.6
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENCLAW_PERSIST_DIR: /data/openclaw-data
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./data:/data
    cpus: 2.0
    mem_limit: 12g
    pids_limit: 1024
    shm_size: 1gb
    stop_grace_period: 60s
